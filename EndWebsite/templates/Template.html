<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VerraSearch</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
        
        body {
            font-family: 'Orbitron', sans-serif;
            background-color: #0d0d0d;
            color: #00ffcc;
            text-align: center;
            padding: 0;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        h1 {
            color: #ff0099;
            text-shadow: 0 0 10px #ff0099, 0 0 20px #ff0066;
        }
        form {
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 15px #00ffff;
        }
        input[type="text"] {
            padding: 10px;
            width: 400px;
            border: 2px solid #00ffcc;
            background: black;
            color: #00ffcc;
            border-radius: 5px;
            font-size: 18px;
            text-align: center;
        }
        button {
            padding: 10px 20px;
            background: #ff0099;
            color: black;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            text-shadow: 0 0 5px #ff0099;
            transition: 0.3s;
        }
        button:hover {
            background: #ff0066;
            box-shadow: 0 0 10px #ff0066;
        }
        .results {
            margin-top: 20px;
            text-align: left;
            display: inline-block;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 15px #00ffcc;
            width: 60%;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            background: rgba(0, 255, 204, 0.2);
            margin: 10px 0;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 0 8px #00ffcc;
        }
        a {
            color: #ff0099;
            text-decoration: none;
            font-weight: bold;
        }
        a:hover {
            text-decoration: underline;
            box-shadow: 0 0 5px #ff0099;
        }
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: repeating-linear-gradient(
                to bottom,
                rgba(0, 0, 0, 0.2) 0px,
                rgba(0, 0, 0, 0.4) 1px,
                transparent 2px
            );
        }
    </style>
</head>
<body>
    <div class="scanlines"></div>
    <h1>VerraSearch By Elif.C</h1>
    <form method="post">
        <input type="text" name="query" placeholder="Suchbegriff eingeben">
        <button type="submit">Suchen</button>
    </form>
    
    <div class="results">
        <h2>Suchergebnisse</h2>
        <ul>
            {% for result in results %}
                <li><a href="{{ result['Link'] }}">{{ result['Titel'] }}</a> - {{ result['Snippet'] }}</li>
            {% endfor %}
        </ul>
    </div>
    
    <a href="/">Neue Suche</a>
</body>
</html>
